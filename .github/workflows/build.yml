name: Build NAB and publish release
on:
  push:
    branches: [main]
    paths: ["nab_constants.py", "BUILD.bat", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read version
        id: v
        shell: pwsh
        run: |
          $m = Select-String -Path nab_constants.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          "ver=" + $m.Matches[0].Groups[1].Value | Out-File -Append $env:GITHUB_OUTPUT
      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build (BUILD.bat)
        shell: cmd
        run: BUILD.bat < nul
      - name: Check the zip exists
        shell: pwsh
        run: |
          if (!(Test-Path build_output/NAB_win.zip)) { throw "NAB_win.zip was not produced" }
          Get-Item build_output/NAB_win.zip | Select-Object Name, Length
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: NAB v${{ steps.v.outputs.ver }}
          files: build_output/NAB_win.zip
