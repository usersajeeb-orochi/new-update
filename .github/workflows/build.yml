name: Build NAB and publish release
on:
  push:
    branches: [main]
    paths: ["nab_constants.py", "BUILD.bat", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read version
        id: v
        shell: pwsh
        run: |
          $m = Select-String -Path nab_constants.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          "ver=" + $m.Matches[0].Groups[1].Value | Out-File -Append $env:GITHUB_OUTPUT
      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run the automatic tests
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Write the Google key from the repository secret
        shell: pwsh
        env:
          GDRIVE_KEY_JSON: ${{ secrets.GDRIVE_KEY_JSON }}
        run: |
          if (-not $env:GDRIVE_KEY_JSON) { throw "Repository secret GDRIVE_KEY_JSON is missing" }
          [IO.File]::WriteAllText("nab_gdrive_creds.json", $env:GDRIVE_KEY_JSON)
      - name: Write the Gmail Drive sign-in from the repository secret
        shell: pwsh
        env:
          DRIVE_USER_JSON: ${{ secrets.DRIVE_USER_JSON }}
        run: |
          if ($env:DRIVE_USER_JSON) { [IO.File]::WriteAllText("nab_drive_user.json", $env:DRIVE_USER_JSON) } else { Write-Host "No DRIVE_USER_JSON secret: building with the service-account key only" }
      - name: Write nab_secrets.json (Telegram bot token + signing key) from the repository secret
        shell: pwsh
        env:
          NAB_SECRETS_JSON: ${{ secrets.NAB_SECRETS_JSON }}
        run: |
          if (-not $env:NAB_SECRETS_JSON) { Write-Error "Secret NAB_SECRETS_JSON is missing - a build without it cannot reach Telegram, so it is not released."; exit 1 }
          [IO.File]::WriteAllText("nab_secrets.json", $env:NAB_SECRETS_JSON)
      - name: Build (BUILD.bat)
        shell: cmd
        run: BUILD.bat < nul
      - name: Check the zip exists
        shell: pwsh
        run: |
          if (!(Test-Path build_output/NAB_win.zip)) { throw "NAB_win.zip was not produced" }
          Get-Item build_output/NAB_win.zip | Select-Object Name, Length
      - name: Make the installer (NAB_Setup.exe)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile build_output/MicrosoftEdgeWebview2Setup.exe
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=${{ steps.v.outputs.ver }}" NAB_Setup.iss
          if (!(Test-Path build_output/NAB_Setup.exe)) { throw "NAB_Setup.exe was not produced" }
          Get-Item build_output/NAB_Setup.exe | Select-Object Name, Length
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: NAB v${{ steps.v.outputs.ver }}
          files: |
            build_output/NAB_win.zip
            build_output/NAB_Setup.exe
