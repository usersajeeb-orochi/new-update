<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Automation Bot</title>
<style>
:root{--bg:#0b0c13;--surf:#131521;--surf2:#1b1e2f;--line:#292d43;--txt:#f3f4fa;--dim:#8f93ac;--acc:#5b8cff;--acc2:#4676f0;--accrgb:91,140,255;
  --font:"Segoe UI Variable Text","Segoe UI","Nirmala UI",system-ui,sans-serif;--mono:Consolas,"Cascadia Mono",ui-monospace,monospace;--disp:"Bahnschrift","Segoe UI Variable Display","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px var(--font);overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:var(--bg)}
#stage{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
/* first frame + no-WebGL fallback: a slow aurora made of three blurred blobs, so the window is never plain black */
#fb{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,rgba(var(--accrgb),.16),transparent 62%),var(--bg)}
#fb i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px);opacity:.38;background:var(--acc);animation:drift 9s ease-in-out infinite alternate}
#fb i:nth-child(2){background:#a855f7;left:-10vmax;top:30%;animation-duration:11s;opacity:.28}
#fb i:nth-child(3){background:#22d3ee;right:-12vmax;top:-20%;animation-duration:13s;opacity:.25}
#fb i:nth-child(1){left:25%;top:20%}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.2)}}
#stage.gl #fb{display:none}
#logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vmin,18px);z-index:6;pointer-events:none}
#letters{display:flex;gap:2.5%;font:900 clamp(54px,15vmin,150px) var(--disp);letter-spacing:.05em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.55),0 0 28px rgba(var(--accrgb),.85),0 0 80px rgba(var(--accrgb),.45)}
#letters span{display:block;color:var(--txt);opacity:0}
#stage.nol #letters{display:none}
#stage.nol #logo{justify-content:flex-start;padding-top:calc(50vh + 19vmin)}
#title{font:700 clamp(11px,2.3vmin,18px) var(--disp);letter-spacing:.38em;color:var(--txt);text-align:center;min-height:1.4em;white-space:nowrap;opacity:0;text-shadow:0 0 14px rgba(var(--accrgb),.8)}
#prog{width:min(56vw,320px);height:3px;background:rgba(var(--accrgb),.2);position:relative;opacity:0;border-radius:3px;overflow:hidden}
#prog i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--acc);box-shadow:0 0 12px var(--acc)}
#boot{font:11px var(--mono);letter-spacing:.14em;color:var(--dim);min-height:1.2em;opacity:.0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.55),rgba(var(--accrgb),.22) 38%,transparent 70%);opacity:0;pointer-events:none;z-index:7}
#hint{position:absolute;left:0;right:0;bottom:4vh;text-align:center;font:11px var(--mono);letter-spacing:.22em;color:var(--dim);opacity:0;pointer-events:none;z-index:8}
</style>
<script>
/* theme tokens, same values as app.css */
var THEMES={dark:{},light:{"--bg":"#f2f3f7","--surf":"#fff","--surf2":"#eef0f5","--line":"#dcdfe8","--txt":"#14161c","--dim":"#6b7080","--acc":"#0a74ff","--acc2":"#0860d6"},
blue:{"--bg":"#0a1220","--surf":"#101b30","--surf2":"#18263f","--line":"#26385a","--txt":"#eef4ff","--dim":"#8fa6cc","--acc":"#4da3ff","--acc2":"#2f86e6"},
snow:{"--bg":"#eef3fa","--surf":"#fbfdff","--surf2":"#e4ecf7","--line":"#cfdaea","--txt":"#16202e","--dim":"#62748f","--acc":"#5b8fd9","--acc2":"#4577c0"},
shadow:{"--bg":"#0d0d10","--surf":"#17171c","--surf2":"#222229","--line":"#34343e","--txt":"#f1f1f4","--dim":"#9a9aa8","--acc":"#b8a1ff","--acc2":"#9a82e8"},
neon:{"--bg":"#080912","--surf":"#0f1020","--surf2":"#181a33","--line":"#2b2f5c","--txt":"#f2f4ff","--dim":"#8e94c9","--acc":"#2ef2d0","--acc2":"#16c9ab"}};
(function(){var n=window.NAB_THEME||new URLSearchParams(location.search).get("theme")||"dark",t=THEMES[n]||{},r=document.documentElement;
  for(var k in t)r.style.setProperty(k,t[k]);
  var h=(t["--acc"]||"#5b8cff").replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c}).join("");
  r.style.setProperty("--accrgb",parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16))})();
</script>
</head><body>
<div id="stage">
  <div id="fb"><i></i><i></i><i></i></div>
  <canvas id="fx"></canvas>
  <div id="logo"><div id="letters"><span>N</span><span>A</span><span>B</span></div><div id="title"></div><div id="prog"><i></i></div><div id="boot"></div></div>
  <div id="flash"></div><div id="hint">PRESS ANY KEY TO SKIP</div>
</div>
<script id="n3d" src="/s/intro_3d.js"></script>
<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ac=null,master=null,soundOn=window.NAB_SOUND!==false,timers=[],scene=null;
  var embedded=window.parent!==window;
  /* ---------- sound (all synthesised, no files) ---------- */
  /* ---------- sound (all synthesised, no files) ---------- */
  function noiseBuf(d){var n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=Math.random()*2-1;return b}
  function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
  function ping(t,f,vol){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;env(g,t,.003,.12*(vol||1),.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3)}
  function rise(t,dur){var o=ac.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(900,t+dur);
    var lp=ac.createBiquadFilter();lp.type="lowpass";lp.Q.value=8;lp.frequency.setValueAtTime(200,t);lp.frequency.exponentialRampToValueAtTime(5000,t+dur);
    var g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+dur*.9);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)}
  function boom(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(34,t+1.1);env(g,t,.005,.9,1.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.4);
    var n=ac.createBufferSource();n.buffer=noiseBuf(.9);var lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(3000,t);lp.frequency.exponentialRampToValueAtTime(200,t+.8);var ng=ac.createGain();env(ng,t,.004,.5,.8);n.connect(lp);lp.connect(ng);ng.connect(master);n.start(t);
    [523,784,1046,1568].forEach(function(f,i){ping(t+.05+i*.07,f,.9)})}
  function whoosh(t,dur){var n=ac.createBufferSource();n.buffer=noiseBuf(dur+.1);var bp=ac.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.2;bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(5200,t+dur);
    var g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+dur*.8);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.08);n.connect(bp);bp.connect(g);g.connect(master);n.start(t)}
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function snd(fn){if(soundOn&&ac)try{fn()}catch(e){}}
  function A(ms){return ac.currentTime+ms/1000}
  function clear(){timers.forEach(function(t){clearTimeout(t);clearInterval(t)});timers=[]}

  /* ---------- the scene ---------- */
  var STYLES=["particles","tunnel","aurora"];
  function pickStyle(){var q=new URLSearchParams(location.search).get("style")||window.NAB_STYLE||"random";
    return STYLES.indexOf(q)>=0?q:STYLES[Math.floor(Math.random()*STYLES.length)]}
  var logoShown=false;
  function showLogo(){
    if(logoShown)return;logoShown=true;
    var fl=$("#flash");fl.animate([{opacity:.7},{opacity:0}],{duration:700,easing:"ease-out",fill:"both"});
    var L=[].slice.call(document.querySelectorAll("#letters span"));
    L.forEach(function(s,i){s.animate([{opacity:0,transform:"translateY(26px) scale(1.5)",filter:"blur(14px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:520,delay:i*110,easing:"cubic-bezier(.2,.8,.25,1)",fill:"both"});snd(function(){ping(A(i*110),700+i*220,.7)})});
    $("#title").textContent="NEWS AUTOMATION BOT";$("#title").animate([{opacity:0,letterSpacing:".7em"},{opacity:1,letterSpacing:".38em"}],{duration:700,delay:260,easing:"ease-out",fill:"both"});
    $("#prog").animate([{opacity:0},{opacity:1}],{duration:400,delay:500,fill:"both"});
    $("#prog i").animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:Math.max(600,(finishAt-logoAtMs)),easing:"cubic-bezier(.3,.6,.3,1)",fill:"both"});
  }
  var logoAtMs=2700,finishAt=3900;
  function run(){
    clear();var style=pickStyle(),cv=$("#fx"),st=$("#stage");
    var cs=getComputedStyle(document.documentElement),accent=cs.getPropertyValue("--acc").trim()||"#5b8cff",bg=cs.getPropertyValue("--bg").trim()||"#0b0c13";
    var gl=false;
    if(!reduce&&window.NAB3D&&NAB3D.supported()){
      try{scene=NAB3D.create(cv,style,{accent:accent,bg:bg,low:(navigator.hardwareConcurrency||4)<=4,getLevel:getLevel,onLogo:showLogo,onBeat:function(n){snd(function(){boom(A(0))})}});
        gl=true;st.classList.add("gl");if(scene.hideLetters)st.classList.add("nol");logoAtMs=scene.logoAt*1000;finishAt=logoAtMs+1300}
      catch(e){scene=null;try{console.error(e)}catch(x){}}
    }
    if(!gl){logoAtMs=reduce?100:900;finishAt=logoAtMs+(reduce?300:1700);at(logoAtMs,showLogo)}
    snd(function(){whoosh(A(60),1.9);rise(A(300),Math.max(1.2,logoAtMs/1000-.5))});
    at(finishAt,finish);
  }

  /* ---------- hand-over to the real app ---------- */
  var done=false,timelineEnd=false,appReady=false,skipped=false,started=false,appFrame=null,hostMode=false;
  function post(m){try{parent.postMessage(m,"*")}catch(e){}}
  function leave(){if(done)return;done=true;
    var st=$("#stage");st.animate([{opacity:1},{opacity:0}],{duration:reduce||skipped?200:600,easing:"ease-in",fill:"forwards"});
    setTimeout(function(){
      if(hostMode){clear();if(scene)scene.dispose();st.remove();try{appFrame.contentWindow.focus()}catch(e){}}
      else post({t:"intro-done"})},reduce||skipped?220:620)}
  function maybeLeave(){if(timelineEnd&&appReady)leave()}
  function finish(){
    timelineEnd=true;showLogo();$("#title").textContent="NEWS AUTOMATION BOT";
    if(appReady){$("#boot").textContent="SYSTEMS ONLINE";$("#boot").style.opacity=1;at(reduce?200:450,maybeLeave)}
    else{if(scene)scene.idle();$("#boot").style.opacity=1;var n=0,iv=setInterval(function(){$("#boot").textContent="FINISHING STARTUP"+".".repeat(n++%4);if(appReady||done)clearInterval(iv)},350);timers.push(iv)}
  }
  function gotReady(){appReady=true;if(timelineEnd){$("#boot").textContent="SYSTEMS ONLINE";at(450,maybeLeave)}}
  window.addEventListener("message",function(e){var d=e.data||{};
    if(d.t==="app-ready"||d.t==="intro-ready")gotReady();
    else if(d.t==="intro-skip")skip();
    else if(d.t==="intro-sound")soundOn=!!d.on});
  function skip(){if(done)return;skipped=true;clear();if(!started)start();showLogo();leave()}
  /* host mode: this page is the first thing in the NAB window; the real app loads underneath in a frame */
  window.NABGO=function(url){
    if(appFrame)return true;hostMode=true;
    appFrame=document.createElement("iframe");appFrame.id="app";appFrame.setAttribute("allow","autoplay; clipboard-read; clipboard-write; fullscreen");appFrame.src=url;
    document.body.insertBefore(appFrame,document.body.firstChild);
    setTimeout(function(){if(!appReady)gotReady()},45000);   // never wait for ever
    return true};
  window.NABSTART=function(){start()};
  var an=null,bins=null,lvl=0;
  function getLevel(){if(!an)return 0;an.getByteFrequencyData(bins);var s=0,n=Math.min(24,bins.length);for(var i=0;i<n;i++)s+=bins[i];lvl+=(s/n/255-lvl)*.4;return lvl}
  function boot(){
    try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;
      var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
      an=ac.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.7;comp.connect(an);bins=new Uint8Array(an.frequencyBinCount)}
      if(ac.state==="suspended")ac.resume()}catch(e){ac=null}
  }
  var t0=performance.now();
  var ran=false;
  function go(){if(ran)return;ran=true;t0=performance.now();run()}
  function start(){if(started)return;started=true;t0=performance.now();if(soundOn)boot();if(embedded)post({t:"intro-loaded"});
    if(window.NAB_DEFER&&!window.NAB3D){window.NAB3DLOADED=function(){clearTimeout(w);go()};var w=setTimeout(go,2600)}else go();   // 3D bundle arrives just after the first paint; the aurora shows meanwhile
    setTimeout(function(){$("#hint").animate([{opacity:0},{opacity:.8}],{duration:600,fill:"forwards"})},1200)}
  ["keydown","pointerdown"].forEach(function(ev){window.addEventListener(ev,function(){if(started&&performance.now()-t0>250)skip()},true)});
  var qs=new URLSearchParams(location.search);if(qs.get("s")==="0")soundOn=false;
  // starts straight away (no blank wait); NABSTART() from Python is then a no-op
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(start,30)});else setTimeout(start,30);
})();
</script></body></html>
